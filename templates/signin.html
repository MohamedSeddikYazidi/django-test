<!-- SIGNIN PAGE -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In • Academe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', serif; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }
        
        .shape:nth-child(1) { width: 300px; height: 300px; top: 10%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 200px; height: 200px; top: 60%; right: 15%; animation-delay: 3s; }
        .shape:nth-child(3) { width: 150px; height: 150px; bottom: 20%; left: 25%; animation-delay: 6s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-2rem) scale(0.85);
            color: #667eea;
        }
        
        .input-group label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            transition: all 0.3s;
            pointer-events: none;
            color: #9ca3af;
        }
        
        .social-btn {
            transition: all 0.3s;
        }
        
        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 relative">

<div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<div class="glass-card rounded-3xl shadow-2xl w-full max-w-md p-8 md:p-12 relative z-10">
    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl shadow-lg mb-4">
            <i class="fas fa-graduation-cap text-white text-2xl"></i>
        </div>
        <h1 class="heading-font text-4xl font-bold gradient-text mb-2">Welcome Back</h1>
        <p class="text-gray-600">Sign in to continue your learning journey</p>
    </div>
    
    <!-- Error Messages -->
    {% for message in messages %}
    <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl flex items-center gap-3 text-red-600">
        <i class="fas fa-exclamation-circle"></i>
        <span class="text-sm">{{ message }}</span>
    </div>
    {% endfor %}
    
    <!-- Sign In Form -->
    <form action="" method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div class="input-group">
            <input 
                type="text" 
                name="username" 
                placeholder=" "
                required
                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-500 focus:bg-white transition"
            >
            <label>Username</label>
        </div>
        
        <div class="input-group">
            <input 
                type="password" 
                name="password" 
                placeholder=" "
                required
                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-500 focus:bg-white transition"
            >
            <label>Password</label>
        </div>
        
        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-purple-600 rounded focus:ring-2 focus:ring-purple-500">
                <span class="text-gray-600">Remember me</span>
            </label>
            <a href="#" class="text-purple-600 hover:text-purple-700 font-medium">Forgot password?</a>
        </div>
        
        <button 
            type="submit" 
            class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition"
        >
            <i class="fas fa-sign-in-alt mr-2"></i>Sign In
        </button>
    </form>
    
    <!-- Divider -->
    <div class="flex items-center gap-4 my-8">
        <div class="flex-1 h-px bg-gray-300"></div>
        <span class="text-sm text-gray-500 font-medium">OR</span>
        <div class="flex-1 h-px bg-gray-300"></div>
    </div>
    
    <!-- Social Login -->
    <div class="grid grid-cols-2 gap-4 mb-8">
        <button class="social-btn py-3 bg-white border-2 border-gray-200 rounded-xl font-medium text-gray-700 hover:border-purple-300">
            <i class="fab fa-google text-red-500 mr-2"></i>Google
        </button>
        <button class="social-btn py-3 bg-white border-2 border-gray-200 rounded-xl font-medium text-gray-700 hover:border-purple-300">
            <i class="fab fa-github mr-2"></i>GitHub
        </button>
    </div>
    
    <!-- Sign Up Link -->
    <p class="text-center text-gray-600">
        Don't have an account? 
        <a href="/signup" class="text-purple-600 font-bold hover:text-purple-700">Sign Up</a>
    </p>
</div>

<!-- Footer -->
<div class="fixed bottom-6 left-0 right-0 text-center text-white text-sm z-10">
    <p class="opacity-75">© 2024 Academe. Building the future of education.</p>
</div>

</body>
</html>
