{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up - Social Book</title>
  <link href="{% static 'assets/images/favicon.png' %}" rel="icon" type="image/png" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">

  <header class="bg-white shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center max-w-6xl">
      <a href="/" class="text-2xl font-bold text-pink-600 hover:text-pink-700">Social Book</a>
      <a href="/signin"
        class="hidden lg:inline-block px-5 py-2 rounded-md bg-pink-600 text-white font-semibold hover:bg-pink-700 transition">Login</a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div
      class="bg-white rounded-lg shadow-lg max-w-md w-full p-10 md:p-12 text-gray-800 dark:bg-gray-900 dark:text-gray-100">
      <h1 class="text-3xl font-extrabold mb-8 text-center text-pink-600">Sign Up</h1>

      <!-- Messages -->
      <div>
        {% for message in messages %}
        <p class="text-red-600 text-center mb-4 font-medium">{{ message }}</p>
        {% endfor %}
      </div>

      <form action="" method="POST" class="space-y-6">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-pink-500 focus:outline-none" />
        <input type="email" name="email" placeholder="Email"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-pink-500 focus:outline-none" />
        <input type="password" name="password" placeholder="Password"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-pink-500 focus:outline-none" />
        <input type="password" name="password2" placeholder="Confirm Password"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-pink-500 focus:outline-none" />

        <button type="submit"
          class="w-full bg-gradient-to-r from-pink-500 to-red-500 hover:from-pink-600 hover:to-red-600 text-white font-semibold py-3 rounded-md transition">
          Sign Up
        </button>
      </form>

      <p class="mt-6 text-center text-gray-600 dark:text-gray-300">
        Already have an account?
        <a href="/signin" class="text-pink-600 font-semibold hover:underline">Login</a>
      </p>
    </div>
  </main>

  <footer class="bg-white shadow mt-auto py-4">
    <div
      class="container max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center text-gray-600 text-sm uppercase space-y-3 md:space-y-0">
      <nav class="flex space-x-6">
        <a href="#" class="hover:text-pink-600">About</a>
        <a href="#" class="hover:text-pink-600">Help</a>
        <a href="#" class="hover:text-pink-600">Terms</a>
        <a href="#" class="hover:text-pink-600">Privacy</a>
      </nav>
      <p>© 2020 Social Book</p>
    </div>
  </footer>

</body>

</html>
