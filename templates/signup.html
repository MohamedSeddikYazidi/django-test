

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up • Academe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', serif; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-2rem) scale(0.85);
            color: #667eea;
        }
        
        .input-group label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            transition: all 0.3s;
            pointer-events: none;
            color: #9ca3af;
        }
        
        .strength-meter {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        
        .strength-bar {
            height: 100%;
            transition: all 0.3s;
            border-radius: 2px;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

<div class="glass-card rounded-3xl shadow-2xl w-full max-w-md p-8 md:p-12">
    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl shadow-lg mb-4">
            <i class="fas fa-graduation-cap text-white text-2xl"></i>
        </div>
        <h1 class="heading-font text-4xl font-bold gradient-text mb-2">Join Academe</h1>
        <p class="text-gray-600">Start your journey to knowledge excellence</p>
    </div>
    
    <!-- Error Messages -->
    {% for message in messages %}
    <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl flex items-center gap-3 text-red-600">
        <i class="fas fa-exclamation-circle"></i>
        <span class="text-sm">{{ message }}</span>
    </div>
    {% endfor %}
    
    <!-- Sign Up Form -->
    <form action="" method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div class="input-group">
            <input 
                type="text" 
                name="username" 
                placeholder=" "
                required
                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-500 focus:bg-white transition"
            >
            <label>Username</label>
        </div>
        
        <div class="input-group">
            <input 
                type="email" 
                name="email" 
                placeholder=" "
                required
                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-500 focus:bg-white transition"
            >
            <label>Email Address</label>
        </div>
        
        <div class="input-group">
            <input 
                type="password" 
                name="password" 
                placeholder=" "
                required
                id="password"
                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-500 focus:bg-white transition"
            >
            <label>Password</label>
            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
        </div>
        
        <div class="input-group">
            <input 
                type="password" 
                name="password2" 
                placeholder=" "
                required
                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-500 focus:bg-white transition"
            >
            <label>Confirm Password</label>
        </div>
        
        <div class="flex items-start gap-3">
            <input type="checkbox" required class="w-5 h-5 text-purple-600 rounded focus:ring-2 focus:ring-purple-500 mt-1">
            <p class="text-sm text-gray-600">
                I agree to the <a href="#" class="text-purple-600 font-medium">Terms of Service</a> and 
                <a href="#" class="text-purple-600 font-medium">Privacy Policy</a>
            </p>
        </div>
        
        <button 
            type="submit" 
            class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition"
        >
            <i class="fas fa-user-plus mr-2"></i>Create Account
        </button>
    </form>
    
    <!-- Sign In Link -->
    <p class="text-center text-gray-600 mt-8">
        Already have an account? 
        <a href="/signin" class="text-purple-600 font-bold hover:text-purple-700">Sign In</a>
    </p>
</div>

<script>
    // Password strength meter
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strengthBar');
    
    passwordInput.addEventListener('input', function() {
        const password = this.value;
        let strength = 0;
        
        if (password.length >= 8) strength += 25;
        if (password.match(/[a-z]+/)) strength += 25;
        if (password.match(/[A-Z]+/)) strength += 25;
        if (password.match(/[0-9]+/)) strength += 25;
        
        strengthBar.style.width = strength + '%';
        
        if (strength <= 25) {
            strengthBar.style.background = '#ef4444';
        } else if (strength <= 50) {
            strengthBar.style.background = '#f59e0b';
        } else if (strength <= 75) {
            strengthBar.style.background = '#10b981';
        } else {
            strengthBar.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        }
    });
</script>

</body>
</html>
